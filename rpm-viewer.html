<style>
:root{
  --bg:#060b18;--bg2:#0a1020;--surface:#0c1628;--card:#0f1e35;--card2:#162440;
  --border:#1a2e4a;--border2:#243d60;
  --amber:#f59e0b;--amber2:#fbbf24;--amber-dim:rgba(245,158,11,.12);
  --blue:#3b82f6;--blue-dim:rgba(59,130,246,.12);
  --green:#10b981;--green-dim:rgba(16,185,129,.12);
  --red:#ef4444;--red-dim:rgba(239,68,68,.12);
  --purple:#a78bfa;--purple-dim:rgba(167,139,250,.12);
  --text:#e2e8f0;--text2:#94a3b8;--text3:#7a8fa8;
  --mono:'IBM Plex Mono',monospace;
  --font:'Barlow',sans-serif;
  --cond:'Barlow Condensed',sans-serif;
  --radius:10px;--radius2:14px;
  --shadow:0 4px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5}
a{color:var(--amber);text-decoration:none}
button{cursor:pointer;font-family:var(--font)}
.mono{font-family:var(--mono)}
/* ── layout ── */
#app{display:none;flex-direction:column;height:100%}
.topbar{height:60px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:4px 18px 0;gap:14px;flex-shrink:0}
.tb-brand{display:flex;align-items:center;gap:8px;cursor:pointer}
.tb-logo{width:26px;height:26px;border-radius:6px;object-fit:contain}
.tb-name{font-family:var(--cond);font-size:19px;font-weight:700;color:var(--amber);letter-spacing:1.5px;white-space:nowrap}
.tb-tag{font-family:var(--cond);font-size:12px;color:var(--purple);letter-spacing:2px;border:1px solid var(--purple);border-radius:5px;padding:1px 7px}
.tb-spacer{flex:1}
.tb-scope{font-family:var(--cond);font-size:13px;color:var(--text2);letter-spacing:1px;text-transform:uppercase}
.ro-badge{font-family:var(--cond);font-size:11px;letter-spacing:1px;color:var(--green);border:1px solid var(--green);border-radius:5px;padding:2px 8px;background:var(--green-dim)}
.btn-topbar{background:var(--card2);border:1px solid var(--border2);color:var(--text2);border-radius:7px;padding:6px 12px;font-size:12px;font-family:var(--cond);letter-spacing:.5px;transition:.15s}
.btn-topbar:hover{border-color:var(--amber);color:var(--amber)}
.crumb{display:flex;align-items:center;gap:8px;font-family:var(--cond);font-size:15px}
.crumb .sep{color:var(--text3)}
.crumb .home{color:var(--amber);cursor:pointer;font-weight:700;letter-spacing:1.5px}
.crumb .cur{color:var(--text)}
.llc-switch select{background:var(--card2);border:1px solid var(--border2);color:var(--text);border-radius:7px;padding:5px 8px;font-size:13px}
#scroll{flex:1;overflow-y:auto;padding:22px}
.wrap{max-width:1180px;margin:0 auto}
/* ── cards / grid ── */
.grid{display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius2);padding:16px}
.card h3{font-family:var(--cond);font-size:15px;color:var(--amber);letter-spacing:.5px;margin-bottom:10px;text-transform:uppercase}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:13px 16px}
.kpi-label{font-family:var(--cond);font-size:11px;color:var(--text3);letter-spacing:1px;text-transform:uppercase}
.kpi-val{font-family:var(--mono);font-size:20px;font-weight:700;margin-top:3px}
.prop-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius2);padding:16px;cursor:pointer;transition:.15s}
.prop-card:hover{border-color:var(--amber);transform:translateY(-1px)}
.prop-card .addr{font-family:var(--cond);font-size:17px;font-weight:600;color:var(--text)}
.prop-card .sub{font-size:12px;color:var(--text3);margin-top:2px}
.pill{display:inline-block;font-size:10px;font-family:var(--cond);letter-spacing:.5px;padding:1px 6px;border-radius:5px;border:1px solid var(--border2);color:var(--text2);margin-left:6px}
/* ── tabs ── */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px;flex-wrap:wrap}
.tab{font-family:var(--cond);font-size:14px;color:var(--text2);padding:9px 15px;letter-spacing:.5px;border-bottom:2px solid transparent;cursor:pointer;background:none;border-top:none;border-left:none;border-right:none}
.tab:hover{color:var(--text)}
.tab.active{color:var(--amber);border-bottom-color:var(--amber)}
/* ── tables ── */
table.rt{width:100%;border-collapse:collapse;font-size:13px}
table.rt th{text-align:left;color:var(--text3);font-family:var(--cond);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:7px 8px;border-bottom:1px solid var(--border2)}
table.rt td{padding:7px 8px;border-bottom:1px solid var(--border);font-size:13px}
table.rt td.r,table.rt th.r{text-align:right;font-family:var(--mono)}
.wf-row{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--border);font-family:var(--mono);font-size:13px}
.wf-row:first-child{border-top:none}
.note-inline{font-size:11px;color:var(--text3);background:var(--bg2);border:1px dashed var(--border2);border-radius:8px;padding:8px 10px;margin-top:10px;line-height:1.5}
.empty{color:var(--text3);text-align:center;padding:22px;font-size:13px}
.sec-head{font-family:var(--cond);font-size:14px;color:var(--text);margin:0 0 8px;letter-spacing:.5px}
/* ── login ── */
#login{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;padding:24px}
#login .box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius2);padding:28px 26px;width:100%;max-width:360px;box-shadow:var(--shadow)}
#login .logo{width:56px;height:56px;border-radius:12px;object-fit:contain;display:block;margin:0 auto 12px}
#login h1{font-family:var(--cond);font-size:24px;color:var(--amber);letter-spacing:2px;text-align:center}
#login .tag{font-family:var(--cond);font-size:12px;color:var(--purple);letter-spacing:2px;text-align:center;margin-bottom:18px}
#login label{display:block;font-family:var(--cond);font-size:12px;color:var(--text3);letter-spacing:.5px;margin:12px 0 4px}
#login input{width:100%;background:var(--card2);border:1px solid var(--border2);color:var(--text);border-radius:8px;padding:9px 11px;font-size:14px;outline:none}
#login input:focus{border-color:var(--amber)}
.btn-primary{background:var(--amber);color:#08111f;border:none;border-radius:8px;padding:11px;width:100%;font-family:var(--cond);font-weight:700;font-size:14px;letter-spacing:1px;margin-top:16px}
.btn-primary:hover{background:var(--amber2)}
.btn-ghost{background:var(--card2);border:1px solid var(--border2);color:var(--text2);border-radius:8px;padding:9px 14px;font-size:13px}
.lerr{color:var(--red);font-size:12px;text-align:center;min-height:16px;margin-top:8px}
.step{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text3);margin-top:6px}
.step .dot{width:16px;height:16px;border-radius:50%;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0}
.step.done .dot{background:var(--green);border-color:var(--green);color:#062}
.step.done{color:var(--text2)}
/* ── toast ── */
#toast{position:fixed;bottom:20px;right:20px;background:var(--card);border:1px solid var(--green);color:var(--text);padding:11px 16px;border-radius:9px;font-size:13px;display:none;align-items:center;gap:8px;z-index:9999;box-shadow:var(--shadow)}
#toast.error{border-color:var(--red)} #toast.warning{border-color:var(--amber)}
</style>
</head>
<body>
<!-- ══ LOGIN / CONNECT ══ -->
<div id="login">
  <div class="box">
    <img id="login-logo" class="logo" alt="RPM">
    <h1>RPM</h1>
    <div class="tag">COMPANION VIEWER · READ-ONLY</div>
    <div id="pwWrap">
      <label>Viewer password</label>
      <input type="password" id="pwInput" placeholder="password set in RPM" onkeydown="if(event.key==='Enter')unlock()">
      <button class="btn-primary" onclick="unlock()">Unlock portfolio</button>
    </div>
    <div class="lerr" id="loginErr"></div>
  </div>
  <div style="font-size:11px;color:var(--text3);max-width:360px;text-align:center">This viewer reads an encrypted snapshot published from RPM. No Google sign-in needed — just the password. You can view everything; nothing here can be edited.</div>
</div>

<!-- ══ APP ══ -->
<div id="app">
  <div class="topbar">
    <div id="tbNav"></div>
    <div class="tb-spacer"></div>
    <div id="tbScope" class="tb-scope"></div>
    <div class="tb-spacer"></div>
    <div class="tb-actions" style="display:flex;align-items:center;gap:10px">
      <span class="pub-ts" id="pubTs" style="font-size:11px;color:var(--text3)"></span>
      <span style="font-size:10px;color:var(--text3);font-family:var(--mono);margin-right:6px">v1.0</span>
      <span class="ro-badge">READ-ONLY</span>
      <button class="btn-topbar" id="refreshBtn" onclick="refreshSnapshot()">⟳ Refresh</button>
      <button class="btn-topbar" onclick="lockViewer()">⎋ Lock</button>
    </div>
  </div>
  <div id="scroll"><div class="wrap" id="view"></div></div>
</div>

<div id="toast"></div>

function fmt$(n){ if(n==null||isNaN(n)) return '$0'; const neg=n<0; n=Math.abs(n);
  return (neg?'-$':'$')+n.toLocaleString('en-US',{maximumFractionDigits:0}); }
function toast(msg,type){ const t=document.getElementById('toast'); t.textContent=msg; t.className=type||'success'; t.style.display='flex'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',2200); }

/* ── read-only display helpers (from RPM, appData-scoped) ── */
function getLLC(id){ return (appData.llcs||[]).find(l=>l.id===id) || null; }
function llcShort(id){ const l=getLLC(id); return l?(l.short||l.name.split(' ')[0]):'—'; }
function propsInScope(){ const all=appData.properties||[]; return scopeLLC==='all'?all:all.filter(p=>p.llcId===scopeLLC); }
function activeTenancy(p){ return (p.tenancies||[]).find(t=>t.status==='active' && !t.endDate) || null; }
function propRent(p){ const t=activeTenancy(p); return t?t.rent:0; }
function propOccupied(p){ return !!activeTenancy(p); }
function primaryClaim(p){ return (p.claims||[]).slice().sort((a,b)=>(a.priority||99)-(b.priority||99))[0] || null; }
function propOwed(p){ return (p.claims||[]).filter(c=>c.endpoint==='payoff').reduce((s,c)=>s+(c.startingBalance||0),0); }
/* ── DERIVED CASH-BASIS BALANCES (v1.0 — identical to the app) ──────
   Held cash = cash-in − cash-out; Reserve/Escrow/Management are
   accumulating earmarks inside it, derived from the ledger accruals +
   tagged cash-out records carried in the published snapshot. */
function deriveBalances(p){
  let rentIn=0,resAccr=0,escAccr=0,mgmtAccr=0;
  (p.ledger||[]).forEach(e=>{
    if(e.type==='rent')          rentIn  += (e.amount||0);
    else if(e.type==='reserve')  resAccr += Math.abs(e.amount||0);
    else if(e.type==='escrow')   escAccr += Math.abs(e.amount||0);
    else if(e.type==='expense')  mgmtAccr+= Math.abs(e.amount||0);
  });
  let cashIn=rentIn, cashOut=0, resDraw=0, escDraw=0, mgmtDraw=0;
  (p.payments||[]).forEach(x=>{
    const amt=x.amount||0;
    if(x.direction==='in'){ cashIn+=amt; return; }
    cashOut+=amt;
    if(x.bucket==='reserve')       resDraw+=amt;
    else if(x.bucket==='escrow')   escDraw+=amt;
    else if(x.bucket==='management')mgmtDraw+=amt;
  });
  (p.maintenance||[]).forEach(m=>{ const amt=m.amount||0; cashOut+=amt; if(m.paidFrom==='reserve') resDraw+=amt; });
  (((p.servicing&&p.servicing.fees)||[])).forEach(f=>{ if(f.takenOn){ const amt=f.takenAmount||0; cashOut+=amt; if(f.takenFrom==='reserve') resDraw+=amt; } });
  (p.advances||[]).forEach(a=>{ if(!a.repaid) cashIn+=(a.amount||0); });
  const held=cashIn-cashOut;
  const reserve=Math.max(0,resAccr-resDraw), escrow=Math.max(0,escAccr-escDraw), mgmt=Math.max(0,mgmtAccr-mgmtDraw);
  return {held,reserve,escrow,mgmt,free:held-reserve-escrow-mgmt,
          cashIn,cashOut,rentIn,resAccr,escAccr,mgmtAccr,resDraw,escDraw,mgmtDraw};
}
function propReserveBal(p){ return deriveBalances(p).reserve; }
function propEscrowBal(p){  return deriveBalances(p).escrow; }
function propMgmtBal(p){    return deriveBalances(p).mgmt; }
function propHeldCash(p){   return deriveBalances(p).held; }
function ledgerRentMTD(p){ const m=new Date().toISOString().slice(0,7); return (p.ledger||[]).filter(e=>e.type==='rent'&&e.date&&e.date.slice(0,7)===m).reduce((s,e)=>s+e.amount,0); }
function ledgerRentYTD(p){ const y=new Date().toISOString().slice(0,4); return (p.ledger||[]).filter(e=>e.type==='rent'&&e.date&&e.date.slice(0,4)===y).reduce((s,e)=>s+e.amount,0); }
function opTotal(p){ return (p.expenses||[]).reduce((s,e)=>s+(e.budgetMonthly||0),0); }
function toDate(s){ return s?new Date(s+'T00:00:00'):null; }
function daysBetween(a,b){ const da=toDate(a),db=toDate(b); if(!da||!db) return null; return Math.round((db-da)/864e5); }
function monthsBetween(a,b){ const da=toDate(a),db=toDate(b); if(!da||!db) return null;
  let m=(db.getFullYear()-da.getFullYear())*12+(db.getMonth()-da.getMonth());
  if(db.getDate()<da.getDate()) m--; return Math.max(0,m); }
function todayISO(){ return new Date().toISOString().slice(0,10); }

/* ── engine (exact from RPM — pure, no mutation) ── */
function reserveContributionFor(p,rent){
  const r=p.reserve||{}; const mode=r.mode||'fixed_monthly';
  if(mode==='fixed_monthly') return r.amount||0;
  if(mode==='percent_rent')  return rent*((r.amount||0)/100);  // `amount` = percent in this mode
  return 0;  // 'none' or 'residual' (residual handled at end)
}
/* Standard amortization P&I (ref: PropIQ calcMortgage). */
function calcMortgage(principal, annualRatePct, years){
  if(principal<=0||years<=0) return 0;
  const mr=(annualRatePct/100)/12, n=years*12;
  if(mr===0) return principal/n;
  return principal*(mr*Math.pow(1+mr,n))/(Math.pow(1+mr,n)-1);
}
/* Single-month distribution. rentOverride lets callers model vacancy (0) or a raise. */
function computeWaterfall(p, rentOverride){
  const rent = (rentOverride!=null?rentOverride:propRent(p));
  const operating = opTotal(p);
  const mode = (p.reserve&&p.reserve.mode)||'fixed_monthly';
  const reserveContribution = (mode==='residual')?0:reserveContributionFor(p,rent);
  const grossAfterOp = rent - operating;
  const afterReserve = grossAfterOp - reserveContribution;     // may be negative on a vacant/short month
  let avail = Math.max(0, afterReserve);
  const claims=(p.claims||[]).slice().sort((a,b)=>(a.priority||99)-(b.priority||99));
  const claimResults=[]; let cashCall=0;
  claims.forEach(c=>{
    const bal=c.startingBalance||0, isPayoff=c.endpoint==='payoff';
    let want, interest=0;
    if(c.basis==='fixed')        want=c.amount||0;
    else if(c.basis==='percent') want=rent*((c.percent||0)/100);
    else if(c.basis==='mortgage'){ want=(c.amount>0?c.amount:calcMortgage(c.originalPrincipal||bal,c.rate||0,c.termYears||30));
                                   interest=bal*((c.rate||0)/100/12); }
    else if(c.basis==='residual')want=avail;                    // absorbs the remainder
    else want=0;
    let pay=Math.max(0, Math.min(want, avail));
    // hard recourse: a shortfall triggers a cash call (partner advance) rather than pausing
    if(c.recourse==='hard' && pay<want){ cashCall+=(want-pay); pay=want; }  // funded by advance
    let debtPay=0, incomePay=0, intPay=0, phase='flow';
    if(isPayoff && bal>0){
      if(c.basis==='mortgage'){ intPay=Math.min(interest,pay); debtPay=Math.min(pay-intPay,bal); incomePay=0;
        phase=(bal-debtPay<=0)?'crossover':'debt'; }
      else { debtPay=Math.min(pay,bal); incomePay=pay-debtPay;
        phase=(bal-debtPay<=0 && pay>0)?'crossover':'debt'; }
    } else if(isPayoff){ incomePay=(c.basis==='mortgage')?0:pay; phase='income'; }
    else { incomePay=pay; phase='flow'; }
    avail-=pay;
    claimResults.push({counterparty:c.counterparty, basis:c.basis, recourse:c.recourse,
      pay, debtPay, incomePay, interest:intPay, balanceBefore:bal, balanceAfter:Math.max(0,bal-debtPay), phase,
      recipient:(incomePay>0 && c.postPayoff&&c.postPayoff.recipient)?c.postPayoff.recipient:c.counterparty});
  });
  let reserveOut=reserveContribution, residual=avail;
  if(mode==='residual'){ reserveOut=residual; residual=0; }    // residual mode: leftover funds reserve
  return {
    rent, operating, reserveMode:mode, reserveContribution:reserveOut,
    availableForClaims:Math.max(0,afterReserve),
    shortfall: afterReserve<0 ? -afterReserve : 0,             // vacant/short month gap (soft = pauses)
    cashCall,                                                   // hard-claim funding needed this month
    claims:claimResults, residualToHeldCash:residual
  };
}
/* Payoff projection at the current recurring payment, with a vacancy haircut (step 4).
   vacancyPct models expected future months with no rent → no payment → slower burn. */
function projectPayoff(p){
  const claim=(p.claims||[]).filter(c=>c.endpoint==='payoff'&&(c.startingBalance||0)>0)
    .sort((a,b)=>(a.priority||99)-(b.priority||99))[0];
  if(!claim) return null;
  const wf=computeWaterfall(p);
  const cr=wf.claims.find(c=>c.counterparty===claim.counterparty);
  const grossMonthly=cr?cr.pay:0;
  const vac=Math.max(0,Math.min(100,(p.projection&&p.projection.vacancyPct)||0));
  const effMonthly=grossMonthly*(1-vac/100);
  const bal=claim.startingBalance||0;
  if(effMonthly<=0) return {balance:bal, monthlyPay:grossMonthly, effMonthly:0, vacancyPct:vac, months:null, years:null, payoffDate:null, stalled:true};
  const months=Math.ceil(bal/effMonthly);
  const d=new Date(); d.setMonth(d.getMonth()+months);
  const baseMonths=grossMonthly>0?Math.ceil(bal/grossMonthly):null;
  return {balance:bal, monthlyPay:grossMonthly, effMonthly, vacancyPct:vac, months, years:months/12,
    payoffDate:d.toISOString().slice(0,10), baseMonths, stalled:false};
}

/* ── disposition + equity (exact from RPM) ── */
function computeDisposition(p, priceOverride){
  const ex=p.exit||{};
  const price=priceOverride!=null?priceOverride:(ex.actualSalePrice||ex.estSalePrice||0);
  const sellPct=ex.sellingCostPct||0;
  const sellingCosts=price*(sellPct/100);
  const disp=(p.servicing&&p.servicing.disposition)||{basis:'none'};
  let dispFee=0;
  if(disp.basis==='percent') dispFee=price*((disp.percent||0)/100);
  else if(disp.basis==='fixed') dispFee=disp.amount||0;
  const claimPayoffs=(p.claims||[]).filter(c=>c.endpoint==='payoff'&&(c.startingBalance||0)>0)
    .map(c=>({counterparty:c.counterparty,amount:c.startingBalance||0}));
  const claimTotal=claimPayoffs.reduce((s,c)=>s+c.amount,0);
  const lotPayback=(p.lot&&p.lot.paidBack===false&&p.lot.treatAsClaim)?(p.lot.amount||0):0;
  const netToEquity=price-sellingCosts-dispFee-claimTotal-lotPayback;
  const costBasis=p.costBasis||0;
  const grossProfit=price-sellingCosts-dispFee-costBasis;
  const roi=costBasis?(grossProfit/costBasis*100):0;
  return {price,sellPct,sellingCosts,dispFee,claimPayoffs,claimTotal,lotPayback,netToEquity,costBasis,grossProfit,roi};
}
function equityDistribution(p, net){
  const eq=(p.equity||[]);
  const rows=eq.map(h=>({name:h.name,pct:h.pct||0,amount:net*((h.pct||0)/100)}));
  const allocated=rows.reduce((s,r)=>s+r.pct,0);
  const llc=getLLC(p.llcId);
  if(allocated<100) rows.push({name:(llc?llc.name:'LLC')+' (residual)',pct:100-allocated,amount:net*((100-allocated)/100),residual:true});
  return rows;
}

/* ════════════════════════════════════════════════════════════════
   AUTH — anonymous API-key read + local viewer-password decrypt.
   No Google sign-in: the shared folder is "Anyone with the link ->
   Viewer", so the file is publicly readable via the API key. The
   password never leaves the browser — it's only the AES key.
════════════════════════════════════════════════════════════════ */
function initLogo(){ const el=document.getElementById('login-logo'); if(RPM_LOGO) el.src=RPM_LOGO; else el.replaceWith(Object.assign(document.createElement('div'),{textContent:'🏘',style:'font-size:44px;text-align:center'})); }
function getFileId(){ const p=new URLSearchParams(location.search); return p.get('file')||DEFAULT_FILE_ID||null; }
function getFolderId(){ const p=new URLSearchParams(location.search); return p.get('folder')||SHARED_FOLDER_ID; }

/* Resolve rpm_shared.json's file id: URL ?file= override, then the
   hardcoded DEFAULT_FILE_ID fast path, then an API-key folder listing. */
async function resolveFileId(){
  const direct=getFileId();
  if(direct) return direct;
  const folderId=getFolderId();
  const q=encodeURIComponent(`name='${SHARED_FILE_NAME}' and '${folderId}' in parents and trashed=false`);
  const r=await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,modifiedTime)&orderBy=modifiedTime desc&key=${DRIVE_API_KEY}`,{signal:AbortSignal.timeout(10000)});
  if(!r.ok) throw new Error('list '+r.status);
  const j=await r.json();
  if(!j.files||!j.files.length) throw new Error('no-snapshot');
  window._snapModified=j.files[0].modifiedTime;
  return j.files[0].id;
}

/* RPM publishes a bare AES ciphertext string; CPM wraps it as
   {v,enc,exportedAt}. Accept either so the viewer can't break on format. */
function extractCipher(text){
  const t=(text||'').trim();
  if(t.charAt(0)==='{'){ try{ const o=JSON.parse(t); if(o&&typeof o.enc==='string'){ if(o.exportedAt) window._snapExportedAt=o.exportedAt; return o.enc; } }catch(_){} }
  return t;
}
function decryptSnapshot(text, pw){
  const cipher=extractCipher(text);
  let plain=''; try{ plain=CryptoJS.AES.decrypt(cipher, pw).toString(CryptoJS.enc.Utf8); }catch(e){ plain=''; }
  return plain;
}
async function fetchSnapshot(){
  const fileId=await resolveFileId();
  const dl=await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&key=${DRIVE_API_KEY}`,{signal:AbortSignal.timeout(10000)});
  if(!dl.ok) throw new Error('download '+dl.status);
  return { text: await dl.text(), modified: window._snapModified||null };
}
async function unlock(){
  const pw=document.getElementById('pwInput').value;
  if(!pw){ loginErr('Enter the viewer password.'); return; }
  loginErr('Unlocking…');
  try{
    if(!cipherText){ const snap=await fetchSnapshot(); cipherText=snap.text; window._snapModified=snap.modified; }
    const plain=decryptSnapshot(cipherText, pw);
    if(!plain){ loginErr('Wrong password, or the snapshot is unreadable.'); return; }
    appData=JSON.parse(plain);
    loginErr('');
    enterApp();
  }catch(e){
    if((''+e.message).indexOf('no-snapshot')>=0) loginErr('No published snapshot found in the shared folder yet.');
    else loginErr('Could not read the snapshot — check the folder is shared "Anyone with the link -> Viewer".');
    console.warn(e);
  }
}
async function refreshSnapshot(){
  try{
    const snap=await fetchSnapshot();
    const pw=document.getElementById('pwInput').value;
    const plain=decryptSnapshot(snap.text, pw);
    if(!plain){ toast('Refresh failed — re-lock and re-enter password','error'); return; }
    appData=JSON.parse(plain); cipherText=snap.text; window._snapModified=snap.modified;
    render(); setPubTs(); toast('Snapshot refreshed');
  }catch(e){ toast('Refresh failed — check the shared link','error'); }
}
function lockViewer(){ appData=null; cipherText=null; scopeLLC='all'; curPropId=null;
  document.getElementById('app').style.display='none';
  document.getElementById('login').style.display='flex';
  document.getElementById('pwInput').value=''; loginErr('');
}
function loginErr(m){ document.getElementById('loginErr').textContent=m||''; }
function enterApp(){ document.getElementById('login').style.display='none'; document.getElementById('app').style.display='flex'; render(); setPubTs(); }
function setPubTs(){
  const el=document.getElementById('pubTs'); if(!el) return;
  const iso=window._snapExportedAt||window._snapModified;
  if(!iso){ el.textContent=''; return; }
  const d=new Date(iso);
  el.textContent = isNaN(d) ? '' : ('published '+d.toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}));
}

/* ════════════════════════════════════════════════════════════════
   RENDER — dashboard + property detail (read-only)
════════════════════════════════════════════════════════════════ */
function goHome(){ curPropId=null; render(); }
function openProp(id){ curPropId=id; curTab='overview'; render(); }
function setScope(v){ scopeLLC=v; curPropId=null; render(); }
function setTab(t){ curTab=t; render(); }
function getProp(){ return (appData.properties||[]).find(p=>p.id===curPropId)||null; }

function render(){
  const llcs=appData.llcs||[];
  // topbar scope + breadcrumb
  const scopeSel=`<span class="llc-switch"><select onchange="setScope(this.value)">
    <option value="all"${scopeLLC==='all'?' selected':''}>All LLCs</option>
    ${llcs.map(l=>`<option value="${l.id}"${scopeLLC===l.id?' selected':''}>${l.name}</option>`).join('')}
    </select></span>`;
  if(!curPropId){
    document.getElementById('tbNav').innerHTML=`<div class="tb-brand" onclick="goHome()">${RPM_LOGO?`<img class="tb-logo" src="${RPM_LOGO}">`:'🏘'}<span class="tb-name">RPM</span><span class="tb-tag">VIEWER</span></div>`;
    document.getElementById('tbScope').innerHTML=scopeSel;
    renderDashboard();
  } else {
    const p=getProp(); const llc=getLLC(p.llcId);
    document.getElementById('tbNav').innerHTML=`<div class="crumb"><span class="home" onclick="goHome()">RPM</span><span class="sep">›</span><span>${llc?llc.name:'—'}</span><span class="sep">›</span><span class="cur">${p.address}</span></div>`;
    document.getElementById('tbScope').innerHTML='';
    renderProperty(p);
  }
}

function renderDashboard(){
  const props=propsInScope();
  const v=document.getElementById('view');
  if(!props.length){ v.innerHTML=`<div class="empty">No properties in this snapshot.</div>`; return; }
  // roll-up
  let totOwed=0, totRent=0, totHeld=0, occ=0;
  props.forEach(p=>{ totOwed+=propOwed(p); totRent+=propRent(p); totHeld+=propHeldCash(p); if(propOccupied(p)) occ++; });
  const roll=`<div class="grid" style="grid-template-columns:repeat(5,1fr);margin-bottom:18px">
    <div class="kpi"><div class="kpi-label">Properties</div><div class="kpi-val">${props.length}</div></div>
    <div class="kpi"><div class="kpi-label">Occupied</div><div class="kpi-val" style="color:var(--green)">${occ}/${props.length}</div></div>
    <div class="kpi"><div class="kpi-label">Monthly rent roll</div><div class="kpi-val" style="color:var(--green)">${fmt$(totRent)}</div></div>
    <div class="kpi"><div class="kpi-label">Held cash</div><div class="kpi-val" style="color:var(--green)">${fmt$(totHeld)}</div></div>
    <div class="kpi"><div class="kpi-label">Total owed (payoff)</div><div class="kpi-val" style="color:var(--amber)">${fmt$(totOwed)}</div></div>
  </div>`;
  const cards=`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">${props.map(p=>{
    const c=primaryClaim(p); const pr=projectPayoff(p);
    return `<div class="prop-card" onclick="openProp('${p.id}')">
      <div class="addr">${p.address}</div>
      <div class="sub">${p.city||''} · ${llcShort(p.llcId)} · ${propOccupied(p)?'<span style="color:var(--green)">occupied</span>':'<span style="color:var(--red)">vacant</span>'}</div>
      <div style="display:flex;justify-content:space-between;margin-top:12px;font-family:var(--mono);font-size:13px">
        <div><div class="kpi-label">Rent</div><div style="color:var(--green)">${fmt$(propRent(p))}/mo</div></div>
        <div><div class="kpi-label">Owed</div><div style="color:var(--amber)">${fmt$(propOwed(p))}</div></div>
        <div><div class="kpi-label">Payoff</div><div>${pr&&pr.months?pr.months+' mo':'—'}</div></div>
      </div>${sparklineSVG(p)}<div style="font-size:10px;color:var(--text3);text-align:center;margin-top:6px">${p.ownership==='loan'?'reserve runway':'projected burn-down'}</div></div>`;
  }).join('')}</div>`;
  v.innerHTML=roll+cards;
}

const DETAIL_TABS=[['overview','Overview'],['monthly','Monthly'],['payments','Ledger'],['payback','Owner Payback'],['servicing','Servicing'],['exit','Exit']];
function renderProperty(p){
  const tabs=`<div class="tabs">${DETAIL_TABS.map(([id,l])=>`<button class="tab${curTab===id?' active':''}" onclick="setTab('${id}')">${l}</button>`).join('')}</div>`;
  let body='';
  if(curTab==='overview') body=roOverview(p);
  else if(curTab==='monthly') body=roMonthly(p);
  else if(curTab==='payments') body=roPayments(p);
  else if(curTab==='payback') body=roPayback(p);
  else if(curTab==='servicing') body=roServicing(p);
  else if(curTab==='exit') body=roExit(p);
  document.getElementById('view').innerHTML=tabs+body;
}

/* ── burn-down visuals (ported from RPM; read-only, reuse projectPayoff) ── */
function sparklineSVG(p){
  const pr=projectPayoff(p);
  const months=pr&&!pr.stalled?pr.months:0;
  if(!months) return `<svg viewBox="0 0 300 30" style="width:100%;height:30px"><line x1="2" y1="15" x2="298" y2="15" stroke="var(--border2)" stroke-width="1" stroke-dasharray="3 3"/></svg>`;
  return `<svg viewBox="0 0 300 30" style="width:100%;height:30px" role="img" aria-label="Projected burn-down">
    <line x1="2" y1="4" x2="298" y2="26" stroke="var(--amber)" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="2" cy="4" r="2.5" fill="var(--amber)"/></svg>`;
}
function burnDownSVG(p,pr){
  if(!pr || pr.stalled){
    return `<svg viewBox="0 0 600 150" style="width:100%;height:150px" role="img" aria-label="Burn-down stalled — no payment">
      <line x1="40" y1="65" x2="590" y2="65" stroke="var(--text3)" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="300" y="55" fill="var(--text3)" font-size="11" text-anchor="middle" font-family="monospace">no recurring payment — burn-down frozen (vacant or cash-flow short)</text></svg>`;
  }
  const M=pr.months;
  const px=40+550*(M/(M+8));
  return `<svg viewBox="0 0 600 150" style="width:100%;height:150px" role="img" aria-label="Burn-down from ${Math.round(pr.balance)} to zero over ${M} months with crossover marker">
    <line x1="40" y1="10" x2="40" y2="120" stroke="var(--border2)" stroke-width="1"/>
    <line x1="40" y1="120" x2="590" y2="120" stroke="var(--border2)" stroke-width="1"/>
    <text x="4" y="16" fill="var(--text3)" font-size="9" font-family="monospace">${Math.round(pr.balance/1000)}k</text>
    <text x="24" y="123" fill="var(--text3)" font-size="9" font-family="monospace">0</text>
    <text x="30" y="135" fill="var(--text3)" font-size="9" font-family="monospace">now</text>
    <text x="${px-20}" y="135" fill="var(--text3)" font-size="9" font-family="monospace">mo ${M}</text>
    <line x1="40" y1="10" x2="${px}" y2="120" stroke="var(--amber)" stroke-width="2"/>
    <circle cx="40" cy="10" r="3" fill="var(--amber)"/>
    <line x1="${px}" y1="10" x2="${px}" y2="120" stroke="var(--purple)" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="${px}" cy="120" r="3.5" fill="var(--purple)"/>
    <text x="${px-70}" y="24" fill="var(--purple)" font-size="9" font-family="monospace">crossover →</text>
    <line x1="${px}" y1="120" x2="590" y2="120" stroke="var(--green)" stroke-width="2"/>
    <text x="${px+8}" y="112" fill="var(--green)" font-size="9" font-family="monospace">income</text>
  </svg>`;
}

/* ── read-only panes ── */
function roOverview(p){
  const wf=computeWaterfall(p); const c=primaryClaim(p); const pr=projectPayoff(p);
  const b=deriveBalances(p);
  const kpis=`<div class="grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:12px">
    <div class="kpi"><div class="kpi-label">Rent</div><div class="kpi-val" style="color:var(--green)">${fmt$(propRent(p))}/mo</div></div>
    <div class="kpi"><div class="kpi-label">Balance owed</div><div class="kpi-val" style="color:var(--amber)">${fmt$(propOwed(p))}</div></div>
    <div class="kpi"><div class="kpi-label">Held cash</div><div class="kpi-val" style="color:var(--green)">${fmt$(b.held)}</div><div style="font-size:10px;color:var(--text3);font-family:var(--mono);margin-top:3px">free ${fmt$(b.free)}</div></div>
    <div class="kpi"><div class="kpi-label">Payoff (proj.)</div><div class="kpi-val">${pr&&pr.months?pr.months+' mo · '+pr.years.toFixed(1)+' yr':'—'}</div></div>
  </div>
  <div class="grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px">
    <div class="kpi"><div class="kpi-label">Reserve</div><div class="kpi-val" style="color:var(--purple)">${fmt$(b.reserve)}</div></div>
    <div class="kpi"><div class="kpi-label">Escrow</div><div class="kpi-val" style="color:var(--blue)">${fmt$(b.escrow)}</div></div>
    <div class="kpi"><div class="kpi-label">Management</div><div class="kpi-val" style="color:var(--amber)">${fmt$(b.mgmt)}</div></div>
  </div>`;
  const wfCard=`<div class="card"><h3>This month's waterfall</h3>
    <div class="wf-row"><span>Rent collected</span><span style="color:var(--green)">+${fmt$(wf.rent)}</span></div>
    <div class="wf-row"><span style="color:var(--text3)">− Operating expenses</span><span style="color:var(--red)">−${fmt$(wf.operating)}</span></div>
    <div class="wf-row"><span style="color:var(--text3)">− Reserve</span><span style="color:var(--blue)">−${fmt$(wf.reserveContribution)}</span></div>
    ${wf.claims.map(cl=>`<div class="wf-row"><span>= To ${cl.counterparty} (${cl.basis})</span><span style="color:var(--amber)">${fmt$(cl.pay)}</span></div>
      <div style="font-size:11px;color:var(--text3);font-family:var(--mono);padding-bottom:4px">↳ ${cl.phase==='income'?'income':'debt paydown'} · debt ${fmt$(cl.debtPay)} · income ${fmt$(cl.incomePay)}</div>`).join('')}
    ${wf.residualToHeldCash>0?`<div class="wf-row"><span>Residual → held cash</span><span>${fmt$(wf.residualToHeldCash)}</span></div>`:''}
  </div>`;
  const details=`<div class="card" style="margin-top:14px"><h3>Property</h3>
    <table class="rt">
      <tr><td>Address</td><td class="r">${p.address}, ${p.city||''}</td></tr>
      <tr><td>Size</td><td class="r">${p.sqft||'—'} sqft · ${p.beds||'—'}bd/${p.baths||'—'}ba · ${p.garage||0}-car</td></tr>
      <tr><td>Ownership</td><td class="r">${p.ownership==='loan'?'Financed':'Owned'}</td></tr>
      <tr><td>Cost basis</td><td class="r">${fmt$(p.costBasis)}</td></tr>
      <tr><td>Recorded rent (MTD / YTD)</td><td class="r" style="color:var(--green)">${fmt$(ledgerRentMTD(p))} / ${fmt$(ledgerRentYTD(p))}</td></tr>
    </table></div>`;
  return kpis+wfCard+details;
}

function roMonthly(p){
  const led=(p.ledger||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const inflow=led.filter(e=>e.amount>0).reduce((s,e)=>s+e.amount,0);
  const outflow=led.filter(e=>e.amount<0).reduce((s,e)=>s+Math.abs(e.amount),0);
  const kpis=`<div class="grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px">
    <div class="kpi"><div class="kpi-label">Last recorded</div><div class="kpi-val">${p.lastRecorded||'—'}</div></div>
    <div class="kpi"><div class="kpi-label">Entries</div><div class="kpi-val">${led.length}</div></div>
    <div class="kpi"><div class="kpi-label">Inflow (logged)</div><div class="kpi-val" style="color:var(--green)">${fmt$(inflow)}</div></div>
    <div class="kpi"><div class="kpi-label">Outflow (logged)</div><div class="kpi-val" style="color:var(--red)">${fmt$(outflow)}</div></div>
  </div>`;
  const rows=led.length?led.map(e=>{ const m=LEDGER_TYPE_META[e.type]||{c:'var(--text2)',l:e.type};
    return `<tr><td>${e.date||''}</td><td><span class="pill" style="color:${m.c};border-color:${m.c}">${m.l}</span></td><td>${e.label||''}</td><td class="r" style="color:${e.amount>=0?'var(--green)':'var(--red)'}">${e.amount>=0?'+':''}${fmt$(e.amount)}</td></tr>`;
  }).join(''):`<tr><td colspan="4" class="empty">No months recorded yet.</td></tr>`;
  return kpis+`<div class="card"><h3>Monthly activity</h3><table class="rt"><tr><th>Date</th><th>Type</th><th>Detail</th><th class="r">Amount</th></tr>${rows}</table>
    <div class="note-inline">Escrow/reserve amounts show as outflows from rent but stay FVH assets (held in those buckets). This is the recurring monthly close.</div></div>`;
}

function roPayments(p){
  const b=deriveBalances(p);
  const yr=window._roYear||new Date().toISOString().slice(0,4);
  // merged cash log: rent-in (Monthly) + disbursements + repairs
  const entries=[];
  (p.ledger||[]).filter(e=>e.type==='rent').forEach(e=>entries.push({date:e.date,dir:'in',amount:e.amount||0,label:'Rent received',tag:'Rent'}));
  (p.payments||[]).forEach(x=>entries.push({date:x.date,dir:x.direction,amount:x.amount||0,label:x.payee||'',tag:x.category||'',link:x.linkType,linkName:x.linkName,bucket:x.bucket,note:x.note}));
  (p.maintenance||[]).forEach(m=>entries.push({date:m.date,dir:'out',amount:m.amount||0,label:'Repair'+(m.description?(' \u2014 '+m.description):''),tag:'Repair',bucket:m.paidFrom==='reserve'?'reserve':null}));
  const years=[...new Set(entries.map(e=>(e.date||'').slice(0,4)).filter(Boolean))].sort().reverse();
  if(!years.includes(yr) && years.length) window._roYear=years[0];
  const useYr=window._roYear||yr;
  const yrE=entries.filter(e=>(e.date||'').slice(0,4)===useYr).sort((a,c)=>(c.date||'').localeCompare(a.date||''));
  const inYr=yrE.filter(e=>e.dir==='in').reduce((s,e)=>s+e.amount,0);
  const outYr=yrE.filter(e=>e.dir==='out').reduce((s,e)=>s+e.amount,0);
  const netYr=inYr-outYr;
  const bd={rent:0,asher:0,mgmt:0,escrow:0,repairs:0,withdraw:0};
  yrE.forEach(e=>{ if(e.dir==='in'&&e.tag==='Rent') bd.rent+=e.amount;
    else if(e.dir==='out'){ if(e.link==='claim') bd.asher+=e.amount; else if(e.link==='withdrawal') bd.withdraw+=e.amount;
      else if(e.bucket==='management') bd.mgmt+=e.amount; else if(e.bucket==='escrow') bd.escrow+=e.amount;
      else if(e.bucket==='reserve'||e.tag==='Repair') bd.repairs+=e.amount; } });
  const yearOpts=(years.length?years:[useYr]).map(y=>`<option value="${y}"${y===useYr?' selected':''}>${y}</option>`).join('');
  const stocks=`<div class="grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:12px">
    <div class="kpi"><div class="kpi-label">Held cash</div><div class="kpi-val" style="color:var(--green)">${fmt$(b.held)}</div><div style="font-size:10px;color:var(--text3);font-family:var(--mono);margin-top:3px">free ${fmt$(b.free)}</div></div>
    <div class="kpi"><div class="kpi-label">Reserve</div><div class="kpi-val" style="color:var(--purple)">${fmt$(b.reserve)}</div></div>
    <div class="kpi"><div class="kpi-label">Escrow</div><div class="kpi-val" style="color:var(--blue)">${fmt$(b.escrow)}</div></div>
    <div class="kpi"><div class="kpi-label">Management (payable)</div><div class="kpi-val" style="color:var(--amber)">${fmt$(b.mgmt)}</div></div>
  </div>`;
  const flows=`<div class="grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:12px">
    <div class="kpi"><div class="kpi-label">Year</div><div class="kpi-val" style="font-size:14px"><select onchange="setRoYear(this.value)" style="background:transparent;border:1px solid var(--border2);color:var(--text);border-radius:6px;padding:4px 8px;font-family:var(--mono)">${yearOpts}</select></div></div>
    <div class="kpi"><div class="kpi-label">Cash received (${useYr})</div><div class="kpi-val" style="color:var(--green)">${fmt$(inYr)}</div></div>
    <div class="kpi"><div class="kpi-label">Cash paid (${useYr})</div><div class="kpi-val" style="color:var(--amber)">${fmt$(outYr)}</div></div>
    <div class="kpi"><div class="kpi-label">Net cash (${useYr})</div><div class="kpi-val" style="color:${netYr>=0?'var(--green)':'var(--red)'}">${fmt$(netYr)}</div></div>
  </div>`;
  const cell=(l,v,c)=>`<div><div style="font-size:8.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px">${l}</div><div style="font-family:var(--mono);font-size:14px;margin-top:3px;color:${c||'var(--text2)'}">${fmt$(v)}</div></div>`;
  const breakdown=`<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px;background:var(--surface,rgba(255,255,255,.02));border:1px dashed var(--border2);border-radius:10px;padding:10px 12px;margin-bottom:14px">
    ${cell('Rent',bd.rent,'var(--green)')}${cell('Asher',bd.asher,'var(--amber)')}${cell('Mgmt paid',bd.mgmt,'var(--amber)')}${cell('Escrow paid',bd.escrow,'var(--blue)')}${cell('Repairs',bd.repairs,'var(--red)')}${cell('Withdrawals',bd.withdraw,'var(--text2)')}
  </div>`;
  const rows=yrE.length?yrE.map(e=>{
    const linkTxt=e.link==='claim'?('\u2192 '+e.linkName+' (burns balance)'):e.link==='withdrawal'?'\u00b7 withdrawal':'';
    const bkt=e.bucket?`<span class="pill" style="color:var(--blue);border-color:var(--blue);margin-left:5px">${e.bucket}</span>`:'';
    return `<tr><td>${e.date||''}</td>
      <td><span class="pill" style="color:${e.dir==='in'?'var(--green)':'var(--amber)'};border-color:${e.dir==='in'?'var(--green)':'var(--amber)'}">${e.dir==='in'?'IN':'OUT'}</span></td>
      <td><b>${e.label}</b>${e.tag?` <span style="color:var(--text3);font-size:11px">\u00b7 ${e.tag}</span>`:''}${bkt} ${linkTxt?`<span style="color:var(--text3);font-size:10px">${linkTxt}</span>`:''}${e.note?`<div style="font-size:11px;color:var(--text3)">${e.note}</div>`:''}</td>
      <td class="r" style="color:${e.dir==='in'?'var(--green)':'var(--text2)'}">${e.dir==='in'?'+':'\u2212'}${fmt$(e.amount)}</td></tr>`;
  }).join(''):`<tr><td colspan="4" class="empty">No cash movements for ${useYr}.</td></tr>`;
  return stocks+flows+breakdown+`<div class="card"><h3>Cash ledger \u2014 ${useYr}</h3><table class="rt"><tr><th>Date</th><th>Dir</th><th>Payee / detail</th><th class="r">Amount</th></tr>${rows}</table></div>
    <div class="note-inline">Read-only. <b>Held cash = cash in \u2212 cash out</b>; Reserve / Escrow / Management are earmarks inside it. Rent-in and repairs are shown here but managed in the app; a claim-linked payment (Asher) burns the balance owed.</div>`;
}
function setRoYear(y){ window._roYear=y; render(); }

function roPayback(p){
  const wf=computeWaterfall(p); const pr=projectPayoff(p);
  const claims=(p.claims||[]).slice().sort((a,b)=>(a.priority||99)-(b.priority||99));
  const kpis=`<div class="grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px">
    <div class="kpi"><div class="kpi-label">Balance owed</div><div class="kpi-val" style="color:var(--amber)">${fmt$(propOwed(p))}</div></div>
    <div class="kpi"><div class="kpi-label">Current payment</div><div class="kpi-val">${fmt$(pr?pr.monthlyPay:0)}/mo</div></div>
    <div class="kpi"><div class="kpi-label">Payoff (proj.)</div><div class="kpi-val">${pr&&pr.months?pr.months+' mo · '+pr.years.toFixed(1)+' yr':'—'}</div></div>
    <div class="kpi"><div class="kpi-label">Then → income to</div><div class="kpi-val" style="font-size:14px;color:var(--purple)">${(claims[0]&&claims[0].postPayoff&&claims[0].postPayoff.recipient)||'—'}</div></div>
  </div>`;
  const stack=`<div class="card"><h3>Claim stack</h3>${claims.length?claims.map((c,i)=>`
    <div style="border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px">
      <div style="font-family:var(--cond);font-size:15px;color:var(--text)">${i+1} · ${c.counterparty}</div>
      <div style="font-size:11px;color:var(--text3)">${c.basis} · ${c.recourse} · ${c.endpoint}${c.postPayoff&&c.postPayoff.convertsToIncome?'→income':''}</div>
      <div style="font-family:var(--mono);margin-top:6px">${fmt$(c.startingBalance||0)} <span style="color:var(--text3);font-size:12px">remaining</span></div>
    </div>`).join(''):'<div class="empty">No claims.</div>'}</div>`;
  const adv=(p.advances||[]);
  const advCard=`<div class="card" style="margin-top:14px"><h3>Partner advances</h3>${adv.length?`<table class="rt"><tr><th>Date</th><th>Partner</th><th class="r">Amount</th></tr>${adv.map(a=>`<tr><td>${a.date||''}</td><td>${a.partner||a.name||'—'}</td><td class="r">${fmt$(a.amount)}</td></tr>`).join('')}</table>`:'<div class="empty">No partner advances.</div>'}</div>`;
  const burnCard=`<div class="card" style="margin-top:14px"><h3>Burn-down projection <span style="font-size:11px;color:var(--text3);font-weight:400">· straight-line at current payment, vacancy-adjusted</span></h3>
    ${burnDownSVG(p,pr)}
    <div style="font-size:10px;color:var(--text3);text-align:center;margin-top:4px">amber = debt paydown · purple = crossover${pr&&!pr.stalled?(' (mo '+pr.months+')'):''} · green = income phase</div></div>`;
  return kpis+stack+advCard+burnCard;
}

function roServicing(p){
  const sv=p.servicing||{}; const fees=sv.fees||[];
  const feeRows=fees.length?fees.map(f=>`<tr><td>${f.label||f.kind}</td><td>${f.kind}</td><td class="r">${fmt$(f.amount)}</td><td class="r">${f.takenOn?('<span style="color:var(--green)">taken '+f.takenOn+'</span>'):(f.active?'pending':'inactive')}</td></tr>`).join(''):`<tr><td colspan="4" class="empty">No servicing fees.</td></tr>`;
  const disp=sv.disposition||{basis:'none'};
  const dispTxt=disp.basis==='percent'?`${disp.percent||0}% of sale price`:disp.basis==='fixed'?fmt$(disp.amount):'None';
  return `<div class="card"><h3>Servicing fees</h3><table class="rt"><tr><th>Label</th><th>Kind</th><th class="r">Amount</th><th class="r">Status</th></tr>${feeRows}</table></div>
    <div class="card" style="margin-top:14px"><h3>Disposition fee</h3><div style="font-family:var(--mono)">${dispTxt}</div>
    <div class="note-inline">Fee priority: ${sv.feePriority||'top'} of the disposition waterfall.</div></div>`;
}

function roExit(p){
  const d=computeDisposition(p); const ex=p.exit||{}; const priced=d.price>0; const closed=ex.status==='closed';
  const dist=equityDistribution(p,d.netToEquity);
  const wf=`<div class="card"><h3>Disposition waterfall ${closed?'<span class="pill" style="color:var(--green);border-color:var(--green)">SOLD</span>':''}</h3>
    <div class="wf-row"><span>Sale price</span><span style="color:var(--green)">+${fmt$(d.price)}</span></div>
    <div class="wf-row"><span style="color:var(--text3)">− Selling costs (${d.sellPct}%)</span><span style="color:var(--red)">−${fmt$(d.sellingCosts)}</span></div>
    ${d.dispFee>0?`<div class="wf-row"><span style="color:var(--text3)">− Disposition fee</span><span style="color:var(--red)">−${fmt$(d.dispFee)}</span></div>`:''}
    ${d.claimPayoffs.map(c=>`<div class="wf-row"><span style="color:var(--text3)">− Payoff ${c.counterparty}</span><span style="color:var(--amber)">−${fmt$(c.amount)}</span></div>`).join('')}
    ${d.lotPayback>0?`<div class="wf-row"><span style="color:var(--text3)">− Lot payback</span><span style="color:var(--red)">−${fmt$(d.lotPayback)}</span></div>`:''}
    <div class="wf-row" style="border-top:1px solid var(--border2)"><span><b>= Net to equity</b></span><span style="color:${!priced?'var(--text3)':(d.netToEquity>=0?'var(--green)':'var(--red)')};font-weight:700">${priced?fmt$(d.netToEquity):'—'}</span></div>
  </div>`;
  const distCard=`<div class="card" style="margin-top:14px"><h3>Equity distribution</h3>${priced?`<table class="rt"><tr><th>Holder</th><th class="r">%</th><th class="r">Amount</th></tr>${dist.map(r=>`<tr><td>${r.name}</td><td class="r">${r.pct.toFixed(1)}%</td><td class="r">${fmt$(r.amount)}</td></tr>`).join('')}</table>`:'<div class="empty">Enter a sale price in RPM to model distributions.</div>'}</div>`;
  const profit=priced?`<div class="card" style="margin-top:14px"><h3>Profit vs cost basis</h3>
    <table class="rt"><tr><td>Cost basis</td><td class="r">${fmt$(d.costBasis)}</td></tr>
    <tr><td>Gross profit</td><td class="r" style="color:${d.grossProfit>=0?'var(--green)':'var(--red)'}">${fmt$(d.grossProfit)}</td></tr>
    <tr><td>ROI</td><td class="r">${d.roi.toFixed(1)}%</td></tr></table></div>`:'';
  return wf+distCard+profit;
}
