<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retirement Contribution Planner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a0e1a'/%3E%3Ctext x='50' y='70' font-size='58' text-anchor='middle' fill='%23f0b429' font-family='sans-serif' font-weight='bold'%3E%24%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0a0e1a; --bg2:#0f1525; --bg3:#161d30; --card:#1a2235; --card2:#1f2a40;
  --border:#2a3650; --accent:#4f8ef7; --accent2:#7eb8f7; --gold:#f0b429; --gold2:#ffd166;
  --green:#2dd4a0; --red:#f87171; --text:#e8edf5; --text2:#8fa3c0; --text3:#4a6080;
  --shadow:0 4px 24px rgba(0,0,0,0.4); --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.5}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
input[type=text],input[type=number],input[type=date],input[type=password],select{
  background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--accent)}
input[type=range]{-webkit-appearance:none;width:100%;height:5px;background:var(--bg3);border-radius:3px;border:1px solid var(--border);padding:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--gold);cursor:pointer;border:2px solid var(--bg)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--gold);cursor:pointer;border:2px solid var(--bg)}
.btn{background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:500;transition:.15s}
.btn:hover{background:var(--card2);border-color:var(--accent)}
.btn.primary{background:var(--gold);color:#1a1200;border-color:var(--gold);font-weight:600}
.btn.primary:hover{background:var(--gold2)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{border-color:#5a2a2a;color:var(--red)}

#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#gateCard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:32px;max-width:420px;width:100%;box-shadow:var(--shadow)}
#gateCard h1{font-size:21px;margin-bottom:6px;color:var(--gold)}
#gateCard p.sub{color:var(--text2);font-size:13px;margin-bottom:22px}
.step{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px}
.step .num{display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#1a1200;text-align:center;font-size:12px;font-weight:700;line-height:20px;margin-right:8px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px;font-weight:500}

#app{display:none}
#topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
#topbar .brand{font-weight:700;color:var(--gold);font-size:15px;letter-spacing:.3px}
#topbar .ver{font-size:11px;color:var(--text3)}
.spacer{flex:1}
.pill{font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer;white-space:nowrap}
#idlePill{cursor:default;font-variant-numeric:tabular-nums}
#tabs{display:flex;gap:2px;padding:0 12px;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:10px 14px;font-size:13px;color:var(--text2);border-bottom:2px solid transparent;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);font-weight:600}
#ctx{background:var(--bg3);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:12.5px}
#ctx .seg button{padding:5px 13px}
.ystep{display:inline-flex;align-items:center;gap:4px}
.ystep button{background:var(--bg2);border:1px solid var(--border);color:var(--text2);width:26px;height:26px;border-radius:6px;font-size:14px;line-height:1}
.ystep button:hover{border-color:var(--gold);color:var(--gold)}
.ystep select{width:auto;padding:4px 8px;font-weight:600;color:var(--gold)}
#ctxMeta{color:var(--text3);font-size:12px}
main{padding:18px;max-width:1240px;margin:0 auto}
.page{display:none}
.page.active{display:block}
h2.ph{font-size:17px;margin-bottom:4px}
p.phs{color:var(--text2);font-size:12.5px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.card h3{font-size:14px;margin-bottom:12px;color:var(--gold);font-weight:600}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px}
.kpi .lab{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.kpi .val{font-size:20px;font-weight:700}
.kpi .sub{font-size:11px;color:var(--text3);margin-top:3px}
.kpi.good .val{color:var(--green)} .kpi.warn .val{color:var(--gold)} .kpi.bad .val{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--text2);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:8px 6px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:7px 6px;border-bottom:1px solid rgba(42,54,80,.5)}
tr:hover td{background:var(--bg2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600;white-space:nowrap}
.tag.pt{background:rgba(79,142,247,.18);color:var(--accent2)}
.tag.rt{background:rgba(45,212,160,.18);color:var(--green)}
.tag.fr{background:rgba(240,180,41,.18);color:var(--gold)}
.tag.sp{background:rgba(248,113,113,.15);color:var(--red)}
.tag.ne{background:rgba(74,96,128,.2);color:var(--text3)}
.bar{display:flex;height:24px;border-radius:6px;overflow:hidden;background:var(--bg3);margin:8px 0}
.bar div{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;overflow:hidden}
.note{background:var(--bg2);border-left:3px solid var(--accent);padding:10px 12px;font-size:12.5px;color:var(--text2);margin:10px 0;border-radius:0 6px 6px 0}
.note.warn{border-left-color:var(--gold)} .note.bad{border-left-color:var(--red)} .note.good{border-left-color:var(--green)}
.sl{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sl label{font-size:12px;color:var(--text2);min-width:118px}
.sl .out{font-size:13px;font-weight:600;min-width:78px;text-align:right;font-variant-numeric:tabular-nums}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:11px 18px;font-size:13px;z-index:200;display:none;box-shadow:var(--shadow);max-width:90vw}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{background:none;border:none;color:var(--text2);padding:6px 14px;font-size:12.5px}
.seg button.on{background:var(--gold);color:#1a1200;font-weight:600}
.chk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text2);margin-bottom:8px}
.chk input{width:auto}
.tblwrap{overflow-x:auto}
#idleMask{position:fixed;inset:0;background:rgba(5,8,15,.82);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
#idleBox{background:var(--card);border:1px solid var(--red);border-radius:var(--radius);padding:26px;max-width:400px;text-align:center;box-shadow:var(--shadow)}
#idleBox h3{color:var(--red);font-size:17px;margin-bottom:8px}
#idleCount{font-size:44px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;margin:12px 0}
</style>
</head>
<body>

<div id="gate">
  <div id="gateCard">
    <h1>Retirement Contribution Planner</h1>
    <p class="sub">Command Center · multi-year 401(k), Roth &amp; LTIP modeling<br><span id="gateVer" style="color:var(--text3);font-size:11.5px"></span></p>
    <div id="gateMsg"></div>
    <div id="firstRun" class="hidden">
      <div class="step">
        <div style="margin-bottom:10px"><span class="num">1</span><strong style="font-size:13px">Verify with Google</strong></div>

</div>

<div id="app">
  <div id="topbar">
    <span class="brand">◆ RETIREMENT PLANNER</span>
    <span class="ver" id="verLbl"></span>
    <span class="spacer"></span>

    <div id="pg-limits" class="page"></div>
    <div id="pg-set" class="page"></div>

</div>

<div id="idleMask"><div id="idleBox">
  <h3>⚠ Session expiring</h3>
  <p style="font-size:13px;color:var(--text2)">You'll be logged off for inactivity.</p>
  <div id="idleCount">60</div>
  <button class="btn primary" style="width:100%" onclick="staySignedIn()">Stay signed in</button>
  <button class="btn" style="width:100%;margin-top:8px" onclick="doLogOff(false)">Log off now</button>
</div></div>

<div id="toast"></div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* =========================================================================
   Retirement Contribution Planner — Command Center suite
   v1.1.0
   CHANGELOG
   v1.2.1 — FIX opening YTD balances were applied even with modelFromDate blank,
            double-counting history across a full-year projection (cumulative began
            at $21,644 on the first check and blew the cap by April). Opening
            balances now apply only when modelFromDate is set; the fields grey out
            and explain themselves otherwise. Solver aligned to the same rule.
   v1.2.0 — FIX raise boundary compared CHECK date to the effective date, so a
            check whose period ended before the raise was paid at the new rate.
            Payroll pays in arrears; the comparison now uses PERIOD START
            (check date − periodLagDays, default 19, verified across 18 Cox
            payment records). For 2026 this moves 03/20 back to the old rate —
            6 old-rate checks, not 5, first new-rate check 04/03.
            NEW per-check salary entry mode, so exact payroll gross can be pinned
            instead of inferring Workday's annual/26 rounding.
            NEW Restoration Plan (NQDC) card — deferral %s, discretionary crediting
            rate, notional credit, and combined deferral rate. Outside all 401(k) limits.
            NEW YTD reconciliation panel: models the excluded span at the current
            election and shows variance against entered actuals, surfacing mid-year
            election changes instead of hiding them.
            NEW explicit warning when the plan offers Roth but 0% is elected and the
            catch-up is forced Roth — the deferrals-stall-at-the-ceiling case.
            Baseline loader now carries payroll-verified figures.
   v1.1.1 — Version now shown on the login screen. Salary card rebuilt: explicit
            Percent/Exact-$ toggle plus before/after/increase/checks-at-each-rate
            readout. Per-person accent colour (picker in Plan Setup) applied to the
            context strip, page headings and cards. Pay Schedule flag column is now
            exception-only — "crossing" marks the check where pre-tax truncates,
            instead of tagging every row "split". Solver rounds pre-tax DOWN and
            Roth UP so it can no longer land short of the cap. Prior-year FICA label
            distinguishes true auto-compute from manual fallback. NEW Settings →
            "Load verified Cox baseline", because migrating an existing Drive file
            preserves user data and therefore never picks up newly-shipped seeds.
   v1.1.0 — Context strip replaces topbar year/person selects (hidden on
            all-persons pages). Configurable idle auto log-off with always-on
            countdown pill + 60s warning modal (timestamp-based, throttle-safe).
            Lock → Log Off: flushes Drive, drops session token, keeps OAuth grant.
            FIX ensureYear() cloned from the LATEST year, not the nearest PRIOR
            year — 2026 was inheriting 2027 projections. Now clones backward and
            rolls salary forward from post-raise value.
            NEW modelFromDate: model the remainder of a year without corrupting
            the year record. NEW explicit post-raise salary override (exact
            segment salaries instead of a percentage guess). NEW bonus formula
            mode (target % × basis × payout %). NEW LTIP tab: 3-year grant
            tracker with floor/assumed/max scenarios, forward cash calendar,
            and FICA-wage feed into the forced-Roth determination.
   v1.0.0 — Initial release.
   ========================================================================= */
const APP_VERSION='v1.2.1';
const LS_HASH='rp_pw_hash', LS_SALT='rp_pw_salt', LS_ATT='rp_attempts', LS_DATA='rp_data', LS_FILEID='rp_drive_file_id';
const DRIVE_FILE_NAME='retirement_planner.json';
const DRIVE_TOKEN_KEY='rp_drive_token';
const SS_IDLE='rp_idle_logoff';
const CLIENT_ID='305146523481-1gucm4vggu2pmucqjgae0vhb1deavnqb.apps.googleusercontent.com';
const SCOPES='https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/drive.file';

let appData=null, curYear=2027, curPerson='p1', curTab='dash', ltipScenario='assumed';
let driveFileId=localStorage.getItem(LS_FILEID)||null, driveConnected=false, accessToken=null,
    driveDataLoaded=false, tokenClient=null;

const $=id=>document.getElementById(id);
const person=()=>appData.people.find(x=>x.id===curPerson)||appData.people[0];
const PACC=()=>person().accent||'#f0b429';
const money=n=>'$'+Math.round(n).toLocaleString();
const money2=n=>'$'+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
function toast(m,ms){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',ms||2600);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function pd(s){const p=String(s||'').split('-');return new Date(+p[0],(+p[1]||1)-1,+p[2]||1,12,0,0);}
function fmtDate(s){return pd(s).toLocaleDateString(undefined,{month:'short',day:'numeric'});}

/* ================= AUTH ================= */
async function pbkdf2(pw,saltB64){
  const salt=Uint8Array.from(atob(saltB64),c=>c.charCodeAt(0));
  const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:210000,hash:'SHA-256'},key,256);
  return btoa(String.fromCharCode(...new Uint8Array(bits)));
}
function newSalt(){return btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(16))));}
function bootGate(){
  $('gateVer').textContent=APP_VERSION;
  if(sessionStorage.getItem(SS_IDLE)){
    sessionStorage.removeItem(SS_IDLE);
    $('gateMsg').innerHTML='<div class="note warn" style="margin-bottom:16px">Logged off for inactivity. Your data was saved.</div>';
  }
  if(localStorage.getItem(LS_HASH)){$('loginBox').classList.remove('hidden');$('lgAtt').textContent=localStorage.getItem(LS_ATT)||'0';setTimeout(()=>$('lgPw').focus(),100);}
  else $('firstRun').classList.remove('hidden');
}
function frGoogle(){
  if(!tokenClient){initGIS();if(!tokenClient){toast('Google library still loading — try again.');return;}}
  tokenClient.requestAccessToken({prompt:'consent'});
}
async function frSetPw(){
  const a=$('frPw1').value,b=$('frPw2').value;
  if(a.length<8)return toast('Password must be at least 8 characters.');
  if(a!==b)return toast('Passwords do not match.');
  const salt=newSalt();
  localStorage.setItem(LS_SALT,salt);
  localStorage.setItem(LS_HASH,await pbkdf2(a,salt));
  localStorage.setItem(LS_ATT,'0');
  launch();
}
async function doLogin(){
  let att=parseInt(localStorage.getItem(LS_ATT)||'0');
  if(att>=10){$('lgErr').textContent='Too many attempts. Re-verify with Google to reset.';return;}
  const h=await pbkdf2($('lgPw').value,localStorage.getItem(LS_SALT));
  if(h===localStorage.getItem(LS_HASH)){localStorage.setItem(LS_ATT,'0');launch();}
  else{att++;localStorage.setItem(LS_ATT,String(att));$('lgAtt').textContent=att;$('lgErr').textContent='Incorrect password.';$('lgPw').value='';}
}
function launch(){
  loadLocal();
  $('gate').style.display='none';
  $('app').style.display='block';
  $('verLbl').textContent=APP_VERSION;
  const ys=Object.keys(appData.irsLimits).map(Number).sort();
  if(!appData.irsLimits[curYear])curYear=ys[ys.length-1];
  render();
  startIdleWatch();
  setTimeout(()=>{if(!driveConnected)connectDriveSilent();},300);
}

/* ================= IDLE ================= */
let lastActivity=Date.now(), idleInterval=null, idleModalOn=false;
function idleMs(){return (Number(appData?.settings?.idleMinutes)||15)*60000;}
function bumpActivity(){lastActivity=Date.now();}
function startIdleWatch(){
  ['mousemove','mousedown','keydown','click','scroll','touchstart','input','wheel']
    .forEach(e=>document.addEventListener(e,bumpActivity,{passive:true}));
  if(idleInterval)clearInterval(idleInterval);
  // timestamp comparison, not a countdown timeout — immune to background-tab throttling
  idleInterval=setInterval(idleTick,1000);
  idleTick();
}
function idleTick(){
  const left=idleMs()-(Date.now()-lastActivity);
  if(left<=0){doLogOff(true);return;}
  const secs=Math.ceil(left/1000);
  const mm=Math.floor(secs/60), ss=secs%60;
  const p=$('idlePill');
  if(p){
    p.textContent=(left<=120000?'⏱ ':'🛡 ')+mm+':'+String(ss).padStart(2,'0');
    p.style.color=left<=60000?'var(--red)':(left<=120000?'var(--gold)':'var(--text2)');
    p.style.borderColor=left<=60000?'var(--red)':(left<=120000?'var(--gold)':'var(--border)');
  }
  if(left<=60000&&!idleModalOn){idleModalOn=true;$('idleMask').style.display='flex';}
  if(left>60000&&idleModalOn){idleModalOn=false;$('idleMask').style.display='none';}
  if(idleModalOn)$('idleCount').textContent=secs;
}
function staySignedIn(){lastActivity=Date.now();idleModalOn=false;$('idleMask').style.display='none';idleTick();}
async function doLogOff(fromIdle){
  if(idleInterval)clearInterval(idleInterval);
  try{ if(driveConnected&&driveDataLoaded&&accessToken) await saveToDrive(); }catch(e){}
  saveLocal();
  // drop the session token; the OAuth grant itself is kept so re-login is silent
  sessionStorage.removeItem(DRIVE_TOKEN_KEY);
  accessToken=null;driveConnected=false;driveDataLoaded=false;
  if(fromIdle)sessionStorage.setItem(SS_IDLE,'1');
  location.reload();
}

/* ================= SEED / MIGRATE ================= */
function seedLimits(){
  return {
    2026:{base:24500,catchUp:8000,superCatchUp:11250,total415c:72000,compLimit:360000,
          rothCatchUpWage:150000,hceThreshold:160000,ira:7500,iraCatchUp:1100,estimated:false},
    2027:{base:25500,catchUp:8000,superCatchUp:11250,total415c:74000,compLimit:370000,
          rothCatchUpWage:155000,hceThreshold:165000,ira:7500,iraCatchUp:1100,estimated:true}
  };
}
function seedPlan(name){
  return {planName:name,matchRate:0.50,matchCapPct:6,trueUp:true,fixedContribPct:0,
          bonusEligible:true,ltipEligible:false,maxDeferralPct:75,rothAvailable:true,

/* =========================================================================
   ENGINE
   ========================================================================= */
function payDates(Y,year){
  const out=[];
  if(Number(Y.payPeriods)===24){
    for(let m=0;m<12;m++){out.push(dstr(new Date(year,m,15,12)));out.push(dstr(new Date(year,m+1,0,12)));}
  }else{
    let d=pd(Y.firstCheckDate||(year+'-01-08'));
    if(d.getFullYear()!==year)d=new Date(year,0,8,12);
    const n=Number(Y.payPeriods)||26;
    for(let i=0;i<n;i++){out.push(dstr(d));d=new Date(d.getTime()+14*86400000);}
  }
  return out;
}
/* Payroll pays in arrears: a check dated D covers a period starting
   D − periodLagDays. A raise effective mid-period therefore first appears on the
   check whose PERIOD START is on/after the effective date — not the first check
   date on/after it. Cox runs a 19-day lag (verified across 18 payment records). */
function periodStart(Y,checkDateStr){
  const lag=Number(Y.periodLagDays);
  return new Date(pd(checkDateStr).getTime()-(isFinite(lag)?lag:19)*86400000);
}
function annualBefore(Y){
  return Y.salaryEntryMode==='check'?Number(Y.baseSalary)*(Number(Y.payPeriods)||26):Number(Y.baseSalary);
}
function annualAfter(Y){
  if(Y.useSalaryOverride)return Y.salaryEntryMode==='check'?Number(Y.newSalary)*(Number(Y.payPeriods)||26):Number(Y.newSalary);
  return annualBefore(Y)*(1+Number(Y.raisePct)/100);
}
function grossBefore(Y){
  return Y.salaryEntryMode==='check'?Number(Y.baseSalary):Number(Y.baseSalary)/(Number(Y.payPeriods)||26);
}
function grossAfter(Y){
  if(Y.useSalaryOverride)return Y.salaryEntryMode==='check'?Number(Y.newSalary):Number(Y.newSalary)/(Number(Y.payPeriods)||26);
  return grossBefore(Y)*(1+Number(Y.raisePct)/100);
}
/* per-check gross for a given check date */
function salaryAt(Y,dateStr){
  return periodStart(Y,dateStr)>=pd(Y.raiseDate)?grossAfter(Y):grossBefore(Y);
}
/* LTIP paid in a given year, per scenario */
function ltipForYear(P,year,scenario){
  let tot=0; const parts=[];
  (P.ltipGrants||[]).forEach(g=>{
    if(Number(g.payYear)!==Number(year))return;
    let amt;
    if(g.actual!=null&&g.actual!==''){amt=Number(g.actual);}
    else{
      const floor=g.floorPct==null?50:Number(g.floorPct);
      let p = scenario==='floor'?floor : scenario==='max'?200 : Math.max(Number(g.assumedPct),floor);
      if(scenario==='max')p=200;
      if(scenario==='floor')p=floor;
      amt=Number(g.target)*p/100;
    }
    tot+=amt; parts.push({grantYear:g.grantYear,amt});
  });
  return {total:tot,parts};
}
/* bonus amount for a year */
function bonusForYear(P,year){
  const Y=P.years[year];
  if(Y.bonusMode==='amount')return Number(Y.bonusAmount)||0;
  let basis=Number(Y.bonusBasisOverride)||0;
  if(!basis){
    // default basis: prior year's total salary earnings if modelled, else current base
    const prev=P.years[year-1];
    if(prev){let s=0;payDates(prev,year-1).forEach(d=>{s+=salaryAt(prev,d);});basis=s;}
    else basis=annualBefore(Y);
  }
  return basis*(Number(Y.bonusTargetPct)/100)*(Number(Y.bonusPayoutPct)/100);
}
/* total FICA wages for a year (salary + bonus + LTIP) */
function ficaForYear(P,year,scenario){
  const Y=P.years[year]; if(!Y)return 0;
  let s=0;payDates(Y,year).forEach(d=>{s+=salaryAt(Y,d);});
  return s+bonusForYear(P,year)+ltipForYear(P,year,scenario||'assumed').total;
}

function computeSchedule(personId,year){
  const P=appData.people.find(x=>x.id===personId);
  if(!P)return null;
  const Y=P.years[year]; const PL=P.plan; const L=appData.irsLimits[year];
  if(!Y||!L)return null;

  const age=year-Number(P.birthYear||0);
  const cuEligible=age>=50;
  const isSuper=age>=60&&age<=63;
  const catchUp=isSuper?Number(L.superCatchUp):(cuEligible?Number(L.catchUp):0);
  const totalLimit=Number(L.base)+catchUp;

  let priorFica=Number(Y.priorYearFicaWages)||0;
  const ficaAuto=!!(Y.autoFica&&P.years[year-1]);
  if(ficaAuto)priorFica=ficaForYear(P,year-1,ltipScenario);
  const forcedRoth=cuEligible&&priorFica>Number(L.rothCatchUpWage)&&PL.rothAvailable;
  const preTaxCeiling=forcedRoth?Number(L.base):totalLimit;

  const periods=Number(Y.payPeriods)||26;
  const evs=payDates(Y,year).map(d=>({date:d,type:'salary',gross:salaryAt(Y,d)}));
  const bonusAmt=bonusForYear(P,year);
  if(bonusAmt>0)evs.push({date:Y.bonusDate,type:'bonus',gross:bonusAmt});
  const ltipAmt=Y.ltipFromGrants?ltipForYear(P,year,ltipScenario).total:(Number(Y.ltipAmount)||0);
  if(ltipAmt>0)evs.push({date:Y.ltipDate,type:'ltip',gross:ltipAmt});
  evs.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.type==='salary'?-1:1));

  const from=Y.modelFromDate?pd(Y.modelFromDate):null;
  // Opening YTD represents history the walk is skipping. With no modelFromDate the
  // walk covers the whole year, so applying it would double-count. Ignore it.
  const useOpening=!!from;
  const opPT=useOpening?(Number(Y.openingPreTax)||0):0;
  const opRT=useOpening?(Number(Y.openingRoth)||0):0;
  const opComp=useOpening?(Number(Y.openingComp)||0):0;

  let ytdPT=opPT, ytdRT=opRT, ytdComp=opComp, ytdMatch=0, ytdFixed=0, ytdGross=0, skipped=0;
  let crossPreTax=null, crossCap=null, shutOffFrom=null;
  const rows=[];

  // shadow pass over excluded events so the UI can reconcile model vs actual YTD
  let histPT=0,histRT=0,histComp=0;
  evs.forEach(ev=>{
    if(from&&pd(ev.date)<from){
      skipped++;
      const el = ev.type==='ltip'?(PL.ltipEligible?ev.gross:0):ev.type==='bonus'?(PL.bonusEligible?ev.gross:0):ev.gross;
      let a,b;
      if(ev.type==='bonus'&&PL.separateBonusElection){a=Number(Y.bonusPreTaxPct);b=Number(Y.bonusRothPct);}
      else{a=Number(Y.preTaxPct);b=Number(Y.rothPct);}
      histPT+=el*a/100; histRT+=el*b/100; histComp+=el;
      return;
    }
    ytdGross+=ev.gross;
    const eligible = ev.type==='ltip' ? (PL.ltipEligible?ev.gross:0)
                   : ev.type==='bonus'? (PL.bonusEligible?ev.gross:0) : ev.gross;
    let ptPct,rtPct;
    if(ev.type==='bonus'&&PL.separateBonusElection){ptPct=Number(Y.bonusPreTaxPct);rtPct=Number(Y.bonusRothPct);}
    else{ptPct=Number(Y.preTaxPct);rtPct=Number(Y.rothPct);}
    if(ptPct+rtPct>Number(PL.maxDeferralPct)){const sc=Number(PL.maxDeferralPct)/(ptPct+rtPct);ptPct*=sc;rtPct*=sc;}

    const wantPT=eligible*ptPct/100, wantRT=eligible*rtPct/100;
    const roomTotal=Math.max(0,totalLimit-ytdPT-ytdRT);
    const roomPT=Math.max(0,Math.min(preTaxCeiling-ytdPT,roomTotal));
    const pt=Math.min(wantPT,roomPT);
    const spill=(PL.spillover&&wantPT>pt)?(wantPT-pt):0;
    const rt=PL.rothAvailable?Math.min(wantRT+spill,Math.max(0,roomTotal-pt)):0;
    const deferral=pt+rt, requested=wantPT+wantRT, blocked=requested-deferral;

    const compForMatch=Math.min(eligible,Math.max(0,Number(L.compLimit)-ytdComp));
    const matchable=Math.min(deferral,compForMatch*Number(PL.matchCapPct)/100);
    const match=matchable*Number(PL.matchRate);
    const fixed=compForMatch*Number(PL.fixedContribPct)/100;

    if(!crossPreTax&&ytdPT<preTaxCeiling&&ytdPT+pt>=preTaxCeiling-0.005)crossPreTax=ev.date;
    if(!crossCap&&ytdPT+ytdRT+deferral>=totalLimit-0.005)crossCap=ev.date;
    if(!shutOffFrom&&deferral<=0.005&&requested>0.005)shutOffFrom=ev.date;

    ytdPT+=pt;ytdRT+=rt;ytdComp+=eligible;ytdMatch+=match;ytdFixed+=fixed;
    rows.push({date:ev.date,type:ev.type,gross:ev.gross,eligible,pt,rt,deferral,blocked,match,fixed,
               ptWanted:wantPT,cum:ytdPT+ytdRT});
  });

  const cappedComp=Math.min(ytdComp,Number(L.compLimit));
  const fullMatch=cappedComp*Number(PL.matchCapPct)/100*Number(PL.matchRate);
  const totalDeferral=ytdPT+ytdRT;
  let trueUp=0;
  if(PL.trueUp&&totalDeferral>=cappedComp*Number(PL.matchCapPct)/100-0.005)trueUp=Math.max(0,fullMatch-ytdMatch);
  const forfeited=Math.max(0,fullMatch-ytdMatch-trueUp);
  const cuUsed=Math.min(catchUp,Math.max(0,totalDeferral-Number(L.base)));
  const additions=totalDeferral-cuUsed+ytdMatch+trueUp+ytdFixed;
  const mRate=(Number(Y.marginalFedPct)+Number(Y.marginalStatePct))/100;

  // Restoration / NQDC (nonqualified — outside every 401(k) limit)
  let restoSal=0;
  payDates(Y,year).forEach(d=>{restoSal+=salaryAt(Y,d)*Number(Y.restoPct)/100;});
  const restoBonus=bonusForYear(P,year)*Number(Y.restoBonusPct)/100;
  const restoTotal=restoSal+restoBonus;
  const restoCredit=(Number(Y.restoOpening)+restoTotal/2)*Number(Y.restoRate)/100;

  // plan offers Roth but none elected — the stall case
  const rothUnelected = PL.rothAvailable && Number(Y.rothPct)<=0 && forcedRoth;

  return {rows,P,Y,PL,L,age,histPT,histRT,histComp,
    restoSal,restoBonus,restoTotal,restoCredit,rothUnelected,cuEligible,isSuper,catchUp,totalLimit,forcedRoth,preTaxCeiling,priorFica,
    useOpening,opPT,opRT,opComp,ficaAuto,ytdPT,ytdRT,totalDeferral,ytdComp,cappedComp,ytdGross,ytdMatch,trueUp,forfeited,fullMatch,ytdFixed,
    headroom415:Math.max(0,Number(L.total415c)-additions),additions,
    crossPreTax,crossCap,shutOffFrom,skipped,bonusAmt,ltipAmt,
    shortfall:Math.max(0,totalLimit-totalDeferral),
    taxDeferred:ytdPT*mRate,takeHomeHit:ytdPT*(1-mRate)+ytdRT,
    compHitsLimit:ytdComp>Number(L.compLimit)};
}

function solve(personId,year){
  const P=appData.people.find(x=>x.id===personId);
  const Y=P.years[year], PL=P.plan, L=appData.irsLimits[year];
  const age=year-Number(P.birthYear||0);
  const cu=(age>=60&&age<=63)?Number(L.superCatchUp):(age>=50?Number(L.catchUp):0);
  const totalLimit=Number(L.base)+cu;
  let priorFica=Number(Y.priorYearFicaWages)||0;
  if(Y.autoFica&&P.years[year-1])priorFica=ficaForYear(P,year-1,ltipScenario);
  const forcedRoth=age>=50&&priorFica>Number(L.rothCatchUpWage)&&PL.rothAvailable;
  const preTaxCeiling=forcedRoth?Number(L.base):totalLimit;
  const from=Y.modelFromDate?pd(Y.modelFromDate):null;
  const periods=Number(Y.payPeriods)||26;

  let comp=0;
  payDates(Y,year).forEach(d=>{if(!from||pd(d)>=from)comp+=salaryAt(Y,d);});
  const bonusAmt=bonusForYear(P,year);
  if(bonusAmt>0&&PL.bonusEligible&&!PL.separateBonusElection&&(!from||pd(Y.bonusDate)>=from))comp+=bonusAmt;
  if(PL.ltipEligible){const l=Y.ltipFromGrants?ltipForYear(P,year,ltipScenario).total:Number(Y.ltipAmount);
    if(l>0&&(!from||pd(Y.ltipDate)>=from))comp+=l;}
  if(comp<=0)return null;

  const op=from?(Number(Y.openingPreTax)||0):0, or=from?(Number(Y.openingRoth)||0):0;
  const need=Math.max(0,totalLimit-op-or);
  const ptNeed=Math.max(0,Math.min(need,preTaxCeiling-op));
  let ptPct=ptNeed/comp*100, rtPct=(need-ptNeed)/comp*100;
  const cap=Number(PL.maxDeferralPct); let capped=false;
  if(ptPct+rtPct>cap){const sc=cap/(ptPct+rtPct);ptPct*=sc;rtPct*=sc;capped=true;}
  // Rounding direction depends on whether pre-tax is genuinely ceiling-bound.
  // When a Roth tier exists, floor pre-tax (can't breach its ceiling) and ceil
  // Roth (absorbs the remainder, so the total still reaches the cap).
  // When there is no Roth tier, nothing can absorb a shortfall — so ceil pre-tax.
  const ptCeilBound = rtPct > 0.0001;
  const ptR = ptCeilBound ? Math.floor(ptPct*10)/10 : Math.ceil(ptPct*10)/10;
  const rtR = ptCeilBound ? Math.ceil(rtPct*10)/10  : 0;
  return {preTaxPct:ptR,rothPct:rtR,combined:Math.round((ptR+rtR)*10)/10,capped,comp,need};
}

function ensureYear(){
  appData.people.forEach(p=>{
    if(p.years[curYear])return;
    const ks=Object.keys(p.years).map(Number).sort((a,b)=>a-b);
    const prior=ks.filter(k=>k<curYear).pop();
    const src=prior!==undefined?p.years[prior]:(ks.length?p.years[ks[0]]:null);
    const nu=src?JSON.parse(JSON.stringify(src)):seedYear(150000,curYear);
    if(src&&prior!==undefined){
      // roll forward: this year's base is last year's POST-raise salary
      nu.baseSalary=src.useSalaryOverride?Number(src.newSalary):Number(src.baseSalary)*(1+Number(src.raisePct)/100);
      nu.useSalaryOverride=false;
      nu.salaryEntryMode=src.salaryEntryMode;
      nu.newSalary=Math.round(nu.baseSalary*(1+Number(src.raisePct)/100)*100)/100;
      nu.bonusPayoutPct=100;
    }
    nu.raiseDate=curYear+'-03-15';nu.bonusDate=curYear+'-04-03';nu.ltipDate=curYear+'-04-03';
    nu.firstCheckDate=curYear+'-01-08';nu.modelFromDate='';
    nu.openingPreTax=0;nu.openingRoth=0;nu.openingComp=0;nu.bonusBasisOverride=0;nu.autoFica=true;
    p.years[curYear]=nu;
  });
  saveLocal();

        <div class="kpi ${r.forfeited>1?'bad':'good'}"><div class="lab">Match</div><div class="val">${money(r.ytdMatch+r.trueUp)}</div><div class="sub">${r.trueUp>1?'incl. true-up '+money(r.trueUp):(r.forfeited>1?money(r.forfeited)+' forfeited':'full match')}</div></div>
      </div>
      <div class="bar">
        <div style="width:${r.ytdPT/r.totalLimit*100}%;background:#2f5d9e;color:#cfe2ff">${r.ytdPT>2000?money(r.ytdPT):''}</div>
        <div style="width:${r.ytdRT/r.totalLimit*100}%;background:#1d7f63;color:#c9f5e6">${r.ytdRT>2000?money(r.ytdRT):''}</div>
        ${r.shortfall>1?`<div style="width:${r.shortfall/r.totalLimit*100}%;background:#3a2020;color:#f8a0a0">${money(r.shortfall)} unused</div>`:''}
      </div>`;
    if(r.shortfall>1){const s=solve(p.id,curYear);
      h+=`<div class="note bad"><strong>Leaving ${money(r.shortfall)} unused.</strong>${s?` Solver: pre-tax <strong>${s.preTaxPct}%</strong> + Roth <strong>${s.rothPct}%</strong>.`:''}</div>`;
    }else{
      h+=`<div class="note good"><strong>Maxing out.</strong> Cap reached ${r.crossCap?fmtDate(r.crossCap):'by year end'}.${r.PL.trueUp?' True-up protects the match.':(r.forfeited>1?' <span style="color:var(--red)">No true-up — '+money(r.forfeited)+' lost.</span>':'')}</div>`;
    }
    if(r.ltipAmt>0)h+=`<div class="note">LTIP of ${money(r.ltipAmt)} paid this year — excluded from plan comp, so no deferral or match, but it counts as FICA wages.</div>`;
    h+=`</div>`;
  });
  h+=`<div class="card"><h3>IRA / Backdoor Roth — separate bucket</h3><div class="grid g3">`;
  appData.people.forEach(p=>{
    const Y=p.years[curYear];const age=curYear-p.birthYear;
    const max=Number(L.ira)+(age>=50?Number(L.iraCatchUp):0);const done=Number(Y.iraContrib)||0;
    h+=`<div class="kpi ${done>=max?'good':'warn'}"><div class="lab">${esc(p.name)}</div><div class="val">${money(done)}</div><div class="sub">of ${money(max)} · ${done>=max?'complete':money(max-done)+' left'}</div></div>`;
  });
  h+=`</div></div>`;
  $('pg-dash').innerHTML=h;
}

      <div class="fld" style="${r.useOpening?'':'opacity:.45'}"><label>Opening Roth YTD</label><input type="number" step="0.01" value="${Y.openingRoth}" onchange="setY('openingRoth',this.value)"></div>
      <div class="fld" style="${r.useOpening?'':'opacity:.45'}"><label>Opening eligible comp YTD</label><input type="number" step="0.01" value="${Y.openingComp}" onchange="setY('openingComp',this.value)"></div>
    </div>
    ${!r.useOpening&&(Number(Y.openingPreTax)||Number(Y.openingRoth))
      ? `<div class="note warn"><strong>Opening balances are inactive.</strong> With <em>Model from</em> blank the schedule covers the whole year, so counting ${money2(Number(Y.openingPreTax)+Number(Y.openingRoth))} of history again would double-count it. Set a <em>Model from</em> date to project the remainder of a year, or leave it blank for a clean full-year projection.</div>`

  h+=`<div class="card"><h3>Restoration Plan (nonqualified)</h3>

  $('pg-plan').innerHTML=h;

function setY(key,val,live){
  const Y=appData.people.find(x=>x.id===curPerson).years[curYear];
  const dateKeys=['raiseDate','bonusDate','ltipDate','firstCheckDate','modelFromDate'];
  const strKeys=['bonusMode','salaryEntryMode'];
  Y[key]=(typeof val==='boolean')?val:(dateKeys.includes(key)||strKeys.includes(key))?val:Number(val);
  saveLocal();
  if(live){const o=$('out_'+key);if(o)o.textContent=val+'%';
    clearTimeout(window._rt);window._rt=setTimeout(()=>{renderPlanner();renderCtx();saveToDrive();},220);}
  else{render();saveToDrive();}
}
function applySolve(){
  const s=solve(curPerson,curYear);
  if(!s)return toast('Nothing to solve — check compensation.');
  const Y=appData.people.find(x=>x.id===curPerson).years[curYear];
  Y.preTaxPct=s.preTaxPct;Y.rothPct=s.rothPct;save();render();
  toast(`Set to ${s.preTaxPct}% pre-tax + ${s.rothPct}% Roth`);
}

function renderSched(){
  const r=computeSchedule(curPerson,curYear);
  let h=`<h2 class="ph" style="border-left:4px solid ${r.P.accent};padding-left:10px">${esc(r.P.name)} — ${curYear} Pay Schedule</h2>
    <p class="phs">Pre-tax ceiling ${money(r.preTaxCeiling)} · total limit ${money(r.totalLimit)}${r.skipped?' · '+r.skipped+' pre-'+fmtDate(r.Y.modelFromDate)+' events excluded':''}</p>
    <div class="card"><div class="tblwrap"><table><thead><tr>
      <th>Date</th><th>Type</th><th class="num">Gross</th><th class="num">Eligible</th>
      <th class="num">Pre-tax</th><th class="num">Roth</th><th class="num">Match</th>
      <th class="num">Cumulative</th><th>Flag</th></tr></thead><tbody>`;
  r.rows.forEach(x=>{
    let f='';
    const ptTrunc = x.blocked<=0.5 && x.pt>0.005 && x.rt>0.005 && x.ptWanted>x.pt+0.005;
    if(x.type==='ltip'&&x.eligible===0)f='<span class="tag ne">excluded</span>';
    else if(x.blocked>0.5&&x.deferral<=0.005)f='<span class="tag sp">shut off</span>';
    else if(x.blocked>0.5)f='<span class="tag sp">capped</span>';
    else if(ptTrunc)f='<span class="tag fr">crossing</span>';
    else if(x.pt<=0.005&&x.rt>0.005)f='<span class="tag rt">roth only</span>';
    h+=`<tr><td>${fmtDate(x.date)}</td>
      <td>${x.type==='salary'?'Salary':x.type==='bonus'?'<strong style="color:var(--gold)">Bonus</strong>':'<strong style="color:var(--text3)">LTIP</strong>'}</td>
      <td class="num">${money(x.gross)}</td><td class="num">${x.eligible?money(x.eligible):'—'}</td>
      <td class="num" style="color:${x.pt>0.005?'var(--accent2)':'var(--text3)'}">${x.pt>0.005?money2(x.pt):'—'}</td>
      <td class="num" style="color:${x.rt>0.005?'var(--green)':'var(--text3)'}">${x.rt>0.005?money2(x.rt):'—'}</td>
      <td class="num">${x.match>0.005?money2(x.match):'—'}</td>
      <td class="num"><strong>${money(x.cum)}</strong></td><td>${f}</td></tr>`;
  });
  h+=`</tbody><tfoot><tr style="border-top:2px solid var(--border)"><th colspan="4">Totals</th>
    <th class="num" style="color:var(--accent2)">${money(r.ytdPT)}</th>
    <th class="num" style="color:var(--green)">${money(r.ytdRT)}</th>
    <th class="num">${money(r.ytdMatch)}</th>
    <th class="num">${money(r.totalDeferral)}</th><th></th></tr></tfoot></table></div>`;
  if(r.trueUp>1)h+=`<div class="note good">True-up of <strong>${money(r.trueUp)}</strong> after year end — per-period ${money(r.ytdMatch)} plus true-up equals the full ${money(r.fullMatch)}.</div>`;
  if(r.forfeited>1)h+=`<div class="note bad">No true-up. Per-period match ${money(r.ytdMatch)} of a possible ${money(r.fullMatch)} — <strong>${money(r.forfeited)} forfeited</strong>.</div>`;
  if(r.ytdFixed>1)h+=`<div class="note">Employer fixed contribution ${money(r.ytdFixed)} at ${r.PL.fixedContribPct}%.</div>`;
  h+=`</div>`;
  $('pg-sched').innerHTML=h;
}

/* ---------- LTIP ---------- */
function renderLtip(){
  const p=appData.people.find(x=>x.id===curPerson);
  const gs=(p.ltipGrants||[]).slice().sort((a,b)=>a.grantYear-b.grantYear);
  let h=`<h2 class="ph" style="border-left:4px solid ${p.accent};padding-left:10px">${esc(p.name)} — LTIP Grants</h2>
    <p class="phs">Three-year cash awards paid at 50–200% of target. Excluded from 401(k) eligible compensation, but counted as FICA wages for the forced-Roth catch-up test.</p>
    <div class="card"><h3>Grants</h3><div class="tblwrap"><table><thead><tr>
      <th>Grant yr</th><th class="num">Target</th><th>Measures</th><th class="num">Pays</th>
      <th class="num">Floor %</th><th class="num">Assumed %</th><th class="num">Actual paid</th>
      <th class="num">Projected</th><th></th></tr></thead><tbody>`;
  gs.forEach(g=>{
    const floor=g.floorPct==null?50:Number(g.floorPct);
    const eff=g.actual!=null&&g.actual!==''?null:(ltipScenario==='floor'?floor:ltipScenario==='max'?200:Math.max(Number(g.assumedPct),floor));
    const proj=g.actual!=null&&g.actual!==''?Number(g.actual):Number(g.target)*eff/100;
    h+=`<tr>
      <td><input type="number" value="${g.grantYear}" onchange="setG('${g.id}','grantYear',this.value)" style="width:70px"></td>
      <td class="num"><input type="number" step="1" value="${g.target}" onchange="setG('${g.id}','target',this.value)" style="width:95px;text-align:right"></td>
      <td style="color:var(--text3)">${g.grantYear}–${Number(g.grantYear)+2}</td>
      <td class="num"><input type="number" value="${g.payYear}" onchange="setG('${g.id}','payYear',this.value)" style="width:70px;text-align:right"></td>
      <td class="num"><input type="number" value="${g.floorPct==null?'':g.floorPct}" placeholder="none" onchange="setG('${g.id}','floorPct',this.value)" style="width:70px;text-align:right"></td>
      <td class="num"><input type="number" value="${g.assumedPct}" onchange="setG('${g.id}','assumedPct',this.value)" style="width:70px;text-align:right"></td>
      <td class="num"><input type="number" step="0.01" value="${g.actual==null?'':g.actual}" placeholder="—" onchange="setG('${g.id}','actual',this.value)" style="width:100px;text-align:right"></td>
      <td class="num"><strong style="color:${g.actual!=null&&g.actual!==''?'var(--text2)':'var(--gold)'}">${money(proj)}</strong><div style="font-size:10px;color:var(--text3)">${g.actual!=null&&g.actual!==''?'actual':eff+'%'}</div></td>
      <td><button class="btn sm danger" onclick="delG('${g.id}')">×</button></td></tr>`;
    if(g.note)h+=`<tr><td colspan="9" style="padding-top:0;border-bottom:1px solid rgba(42,54,80,.5)"><span style="font-size:11.5px;color:var(--text3)">${esc(g.note)}</span></td></tr>`;
  });
  h+=`</tbody></table></div>
    <div style="margin-top:12px"><button class="btn" onclick="addG()">+ Add grant</button></div></div>`;

  // forward calendar
  const thisYr=curYear, yrs=[];
  for(let y=thisYr;y<=thisYr+4;y++)yrs.push(y);
  h+=`<div class="card"><h3>Forward cash calendar — ${ltipScenario} scenario</h3>
    <div class="grid g4">`;
  yrs.forEach(y=>{
    const lo=ltipForYear(p,y,'floor').total, as=ltipForYear(p,y,'assumed').total, hi=ltipForYear(p,y,'max').total;
    const cur=ltipScenario==='floor'?lo:ltipScenario==='max'?hi:as;
    const parts=ltipForYear(p,y,ltipScenario).parts;
    h+=`<div class="kpi ${cur>0?'warn':''}"><div class="lab">${y}</div>
      <div class="val">${cur>0?money(cur):'—'}</div>
      <div class="sub">${parts.length?parts.map(x=>x.grantYear+' grant').join(', '):'no grant matures'}${cur>0&&lo!==hi?`<br>range ${money(lo)}–${money(hi)}`:''}</div></div>`;
  });
  h+=`</div>
    <div class="note">Payout scenario is set in the context strip above and flows through to the Planner and Dashboard — LTIP feeds the prior-year FICA wage figure that determines whether your catch-up must be Roth.</div>
    <div class="note warn">Per the 2026 LTIP FAQ, the 2024 and 2025 grants carry a 100% minimum payout because the value-creation measurement change applies to awards not yet vested. The 2026 grant has no floor and ranges 50–200%. Cox + Charter conveyance may alter vesting on all open grants.</div>
    </div>`;
  $('pg-ltip').innerHTML=h;
}
function setG(id,key,val){
  const p=appData.people.find(x=>x.id===curPerson);
  const g=p.ltipGrants.find(x=>x.id===id); if(!g)return;
  if(key==='floorPct'||key==='actual')g[key]=(val===''||val==null)?null:Number(val);
  else g[key]=Number(val);
  save();render();
}
function addG(){
  const p=appData.people.find(x=>x.id===curPerson);
  const y=curYear;
  p.ltipGrants.push({id:'g'+Date.now(),grantYear:y,target:0,payYear:y+3,floorPct:null,assumedPct:100,actual:null,note:''});
  save();render();
}
function delG(id){
  const p=appData.people.find(x=>x.id===curPerson);
  p.ltipGrants=p.ltipGrants.filter(x=>x.id!==id);save();render();
}

function setIdle(m){appData.settings.idleMinutes=Number(m);save();bumpActivity();idleTick();toast('Auto log-off set to '+m+' minutes.');}
function resetAll(){
  if(!confirm('Erase all planner data and reseed defaults? The Drive file is not deleted.'))return;
  appData=seedData();save();render();toast('Reset complete.');
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(appData,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=dstr(new Date())+'-retirement_planner.json';a.click();
}
function importJSON(e){
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{appData=JSON.parse(rd.result);migrate();save();render();toast('Imported.');}catch(x){toast('Invalid JSON file.');}};
  rd.readAsText(f);
}

/* ================= DRIVE ================= */
function initGIS(){
  if(!window.google||!google.accounts||!google.accounts.oauth2)return;
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID,scope:SCOPES,
    callback:async r=>{
      silentDone=true;
      if(r.error){toast('Drive auth failed: '+r.error);return;}
      accessToken=r.access_token;driveConnected=true;
      sessionStorage.setItem(DRIVE_TOKEN_KEY,accessToken);
      setPill('⬤ Connected','var(--green)');
      if($('gate').style.display!=='none'&&!localStorage.getItem(LS_HASH)){
        $('frGStat').textContent='✓ Verified — now set a password.';
        $('frStep2').classList.remove('hidden');return;
      }
      await loadFromDrive();
    }
  });
}
window.addEventListener('load',()=>{if(window.google?.accounts?.oauth2)initGIS();});
function connectDrive(){
  if(!tokenClient){initGIS();if(!tokenClient)return toast('Auth library loading — try again shortly.');}
  tokenClient.requestAccessToken({prompt:''});
}
let silentDone=false,silentFlight=false;
function connectDriveSilent(){
  if(!tokenClient){initGIS();if(!tokenClient)return;}
  if(silentFlight)return;
  silentFlight=true;silentDone=false;
  setTimeout(()=>{silentFlight=false;if(!silentDone&&!driveConnected)toast('Drive needs re-auth — click the Drive pill.',5000);},3000);
  try{tokenClient.requestAccessToken({prompt:''});}catch(e){silentFlight=false;silentDone=true;}
}
function setPill(txt,color){const p=$('drivePill');if(!p)return;p.textContent=txt;p.style.color=color;p.style.borderColor=color;}
async function saveToDrive(){
  saveLocal();
  if(!driveDataLoaded||!driveConnected||!accessToken)return;
  try{
    setPill('⬤ Saving…','var(--gold)');
    const blob=new Blob([JSON.stringify(appData,null,2)],{type:'application/json'});
    let url,method,body=blob;
    if(driveFileId){url=`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`;method='PATCH';}
    else{
      url='https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';method='POST';
      const form=new FormData();
      form.append('metadata',new Blob([JSON.stringify({name:DRIVE_FILE_NAME,parents:['appDataFolder']})],{type:'application/json'}));
      form.append('file',blob);body=form;
    }
    const res=await fetch(url,{method,headers:{'Authorization':'Bearer '+accessToken},body});
    const j=await res.json();
    if(j.id){driveFileId=j.id;localStorage.setItem(LS_FILEID,driveFileId);}
    setPill('⬤ Synced '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),'var(--green)');
  }catch(e){setPill('⬤ Save failed','var(--red)');}
}
async function loadFromDrive(){
  if(!driveConnected||!accessToken)return toast('Connect Drive first.');
  try{
    setPill('⬤ Loading…','var(--gold)');
    if(!driveFileId){
      const q=encodeURIComponent(`name='${DRIVE_FILE_NAME}'`);
      const fr=await fetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id)`,
        {headers:{'Authorization':'Bearer '+accessToken}});
      const fj=await fr.json();
      if(fj.files&&fj.files.length){driveFileId=fj.files[0].id;localStorage.setItem(LS_FILEID,driveFileId);}
    }
    if(!driveFileId){driveDataLoaded=true;setPill('⬤ New file','var(--green)');saveToDrive();return;}
    const res=await fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`,
      {headers:{'Authorization':'Bearer '+accessToken}});
    const j=await res.json();
    if(j&&j.people){appData=j;migrate();saveLocal();}
    driveDataLoaded=true;
    const ys=Object.keys(appData.irsLimits).map(Number).sort();
    if(!appData.irsLimits[curYear])curYear=ys[ys.length-1];
    render();
    setPill('⬤ Synced '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),'var(--green)');
  }catch(e){setPill('⬤ Load failed','var(--red)');toast('Could not load from Drive: '+e.message);}
}

bootGate();
